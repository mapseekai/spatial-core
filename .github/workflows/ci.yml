name: Spatial core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: spatial_core_test
        ports: ["5432:5432"]
        volumes:
          - /tmp/spatial-core-fixtures:/tmp/spatial-core-fixtures:ro
        options: >-
          --health-cmd "pg_isready -U postgres -d spatial_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SPATIAL_CORE_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres dbname=spatial_core_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev gdal-bin libclang-dev pkg-config postgresql-client
          sudo install -d -m 1777 /tmp/spatial-core-fixtures
      - name: Independent library checks
        run: bash scripts/ci/check.sh
      - name: Enable PostGIS extensions
        run: |
          psql "$SPATIAL_CORE_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;' -c 'CREATE EXTENSION IF NOT EXISTS postgis_raster;'
      - name: Database regressions
        env:
          TMPDIR: /tmp/spatial-core-fixtures
        run: |
          bash scripts/ci/test-postgis.sh
          cargo run --locked --example postgis_vector
          cargo run --locked --example postgis_raster

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - name: Install build tools
        run: brew install llvm pkg-config
      # Homebrew tracks newer GDAL APIs that gdal 0.19 cannot compile against.
      # Keep GDAL, its headers, pkg-config metadata and PROJ data in one prefix.
      - name: Install GDAL 3.12.2
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: 2.10.0-0
          environment-name: gdal-ci
          create-args: >-
            --override-channels --channel conda-forge --strict-channel-priority
            libgdal-core==3.12.2
          init-shell: none
          post-cleanup: all
          micromamba-root-path: ${{ runner.temp }}/micromamba
          micromamba-binary-path: ${{ runner.temp }}/micromamba-bin/micromamba
      - name: Verify GDAL and run independent library checks
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          export GDAL_HOME="$CONDA_PREFIX"
          export GDAL_INCLUDE_DIR="$GDAL_HOME/include"
          export GDAL_LIB_DIR="$GDAL_HOME/lib"
          export GDAL_DATA="$GDAL_HOME/share/gdal"
          export PROJ_DATA="$GDAL_HOME/share/proj"
          export PROJ_NETWORK=OFF
          export PKG_CONFIG_PATH="$GDAL_HOME/lib/pkgconfig"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          # Conda dylibs use @rpath; Cargo's -L alone does not set runtime lookup.
          export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,$GDAL_LIB_DIR"
          export RUSTDOCFLAGS="${RUSTDOCFLAGS:-} -C link-arg=-Wl,-rpath,$GDAL_LIB_DIR"
          bash scripts/ci/check-gdal.sh "$GDAL_HOME" 3.12.2
          bash scripts/ci/check.sh
