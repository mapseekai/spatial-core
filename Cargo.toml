[package]
name = "spatial-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Low-level GIS conversion, metadata, and cancellable PostGIS ingestion"
readme = "README.md"
repository = "https://github.com/mapseekai/spatial-core"
license-file = "LICENSE"
publish = false

[lib]
name = "spatial_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["sync", "rt", "fs", "macros", "time"] }
gdal = { version = "0.19.0", features = ["bindgen"] }
gdal-sys = "0.12.0"
wkb-raster = "0.2.1"
bytes = "1.12.1"
thiserror = "2.0.20"
libc = "0.2.189"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14.2"
tempfile = "3.27.0"
tracing = "0.1.44"
chrono = "0.4.45"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net", "io-util"] }
uuid = { version = "1.26.1", features = ["v4", "fast-rng"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
undocumented_unsafe_blocks = "warn"
